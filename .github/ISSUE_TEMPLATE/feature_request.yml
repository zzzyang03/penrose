name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation where Penrose falls short today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like Penrose to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds you have tried
