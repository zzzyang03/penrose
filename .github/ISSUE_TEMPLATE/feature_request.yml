name: 功能建议 / Feature request
description: 提出想法或改进 / Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题？ / What problem would this solve?
      description: 描述一下 Penrose 目前在什么情况下不够好用。 / Describe the situation where Penrose falls short today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 希望 Penrose 怎么做？ / What would you like Penrose to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 尝试过的替代方案或变通办法 / Alternatives or workarounds you have tried
